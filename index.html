<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klasboek</title>
  <meta name="description" content="Plan lessons from your ATP and timetable, make lesson plans, worksheets and slides, and run moderation. Works offline.">
  <meta name="theme-color" content="#1E3B33">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="34" height="34">
        <span>Klasboek</span>
      </div>
      <ul id="nav"></ul>
      <div class="rail-foot">
        <span id="net" class="net"></span>
        <button id="install" class="install" hidden>Install app</button>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <noscript>Klasboek needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
